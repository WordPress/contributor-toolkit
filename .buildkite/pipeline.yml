# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json

---
steps:
  ########################################################
  # Windows build
  ########################################################
  # RELEASING.md ships the artifacts from the release/* pull request's build, so that branch signs too.
  - label: ":windows: Windows Build"
    if: build.branch == "trunk" || build.branch =~ /^release\//
    agents: { queue: windows }
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    env:
      SIGN_WINDOWS_BUILD: 1
    command: .buildkite/commands/build_windows.ps1
    artifact_paths:
      - dist\*.exe
    notify:
      - github_commit_status: { context: "Windows Build" }

  - label: ":windows: Windows Build (unsigned)"
    if: build.branch != "trunk" && build.branch !~ /^release\//
    agents: { queue: windows }
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    command: .buildkite/commands/build_windows.ps1
    artifact_paths:
      - dist\*.exe
    notify:
      - github_commit_status: { context: "Windows Build" }

  ########################################################
  # macOS build
  ########################################################
  - label: ":mac: macOS Build"
    agents: { queue: mac }
    env:
      IMAGE_ID: $IMAGE_ID
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    command: |
      set -eu

      source .buildkite/commands/setup_macos_code_signing.sh

      echo "~~~ Install dependencies"
      .buildkite/commands/install_node_dependencies.sh

      echo "~~~ Build macOS artifact"
      npm run dist

      echo "~~~ Verify macOS code signing"
      bundle exec fastlane verify_code_signing
    artifact_paths:
      - dist/*.dmg
      - dist/*.zip
    notify:
      - github_commit_status: { context: "macOS Build" }

  ########################################################
  # Linux build
  ########################################################
  - label: ":linux: Linux Build"
    agents: { queue: default }
    command: |
      set -eu

      echo "~~~ Verify build environment"
      cat /etc/os-release
      node --version
      gcc --version
      g++ --version

      echo "~~~ Install Node dependencies"
      npm ci --no-audit --no-progress --maxsockets 1

      echo "~~~ Build Linux artifact"
      npm run dist
    plugins:
      - $DOCKER_PLUGIN:
          image: "$NODE_DOCKER_IMAGE"
          always-pull: true
    artifact_paths:
      - dist/*.AppImage
    notify:
      - github_commit_status: { context: "Linux Build" }

  ########################################################
  # Signed Windows build on demand
  ########################################################
  # Last, because every step after a block waits for it.
  - block: ":lock: Sign the Windows build?"
    if: build.branch != "trunk" && build.branch !~ /^release\//
    key: sign-windows-build

  - label: ":windows: Windows Build (signed)"
    if: build.branch != "trunk" && build.branch !~ /^release\//
    depends_on: sign-windows-build
    agents: { queue: windows }
    plugins: [$CI_TOOLKIT, $NVM_PLUGIN]
    env:
      SIGN_WINDOWS_BUILD: 1
    command: .buildkite/commands/build_windows.ps1
    artifact_paths:
      - dist\*.exe
