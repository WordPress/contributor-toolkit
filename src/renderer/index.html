<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"> 
  <title>WordPress Contributor Toolkit</title>
  <link rel="stylesheet" href="index.css" />
  <script defer src="index.js"></script>
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="no-referrer" />
  <meta http-equiv="Cross-Origin-Resource-Policy" content="same-site" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
  <meta http-equiv="Permissions-Policy" content="clipboard-read=(self), clipboard-write=(self)" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Both schemes, since #560: the page paints each one. Which the window is in
    is Electron's `nativeTheme`, which main sets from the theme setting and
    Chromium answers `prefers-color-scheme` from. Declaring both lets the
    browser paint the parts it owns, the native form controls, in the scheme
    the page is in; declaring `light` alone would paint them light inside a
    dark window. tests/unit/color-scheme.test.cjs holds the declaration and
    the colour below to the theme module.
  -->
  <meta name="color-scheme" content="light dark" />
  <!--
    The page's first paint is before its script runs, and the tokens
    stylesheet it paints with holds the light theme's values; the dark ones
    are set on the document once the app has mounted. Without this, a dark
    window shows a light page for that moment. Until the design system's
    provider has mounted, which it marks on the document, and no longer: the
    colour is the dark seed in src/theme.cjs, the one colour the window has
    that is not a token, and after that moment the tokens are the theme.
  -->
  <style>@media (prefers-color-scheme: dark) { html:not([data-wpds-root-provider]) body { background: #1e1e1e; } }</style>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>
  <div id="root"></div>
</body>
</html>
